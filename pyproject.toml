[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanohome"
version = "0.1.0"
description = "One window for every nano app on this computer: it finds them, explains them, and starts them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["launcher", "no-code", "dashboard", "offline", "beginners"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: System :: Software Distribution",
]
# Nothing is required, on any operating system. It only starts what is already here, and only when you press Start.
dependencies = []

[project.scripts]
nanohome = "nanohome.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanohome"

[tool.setuptools]
packages = ["nanohome"]
include-package-data = true

[tool.setuptools.package-data]
nanohome = ["web/*"]
